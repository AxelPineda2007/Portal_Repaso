<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Repaso · 3.º DS «B» HUB</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="wrap">
            <span class="marca">INDEL · 3.º Desarrollo de Software «B»</span>
            <h1>Portal HUB de Repaso Anual</h1>
            <p class="lead">Resumen completo de módulos, herramientas, prácticas y evidencias del año.</p>
        </div>
    </header>

    <main class="wrap">
        <section class="buscador-sec">
            <input type="text" id="buscador" placeholder="Busca un módulo, herramienta o tema...">
        </section>

        <section>
            <h2>Módulos del Año</h2>
            <div id="contenedor-modulos" class="grid-modulos">
                <!-- Se inyecta dinámicamente desde data/modulos.js -->
            </div>
        </section>
    </main>

    <footer>
        <div class="wrap">
            <p><b>Autor:</b> Axel Pineda · Instituto Nacional Cantón Lourdes (INDEL)</p>
        </div>
    </footer>

    <script src="data/modulos.js"></script>
    <script src="script.js"></script>
</body>
</html>
